name: Build LaTeX document
on: [push, workflow_dispatch]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX (explicit 2 passes)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workdir -w /workdir ghcr.io/xu-cheng/texlive-full:latest sh -c "apk add font-liberation && xelatex -interaction=nonstopmode article.tex && xelatex -interaction=nonstopmode article.tex"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: article.pdf
