name: Build LaTeX document
on: [push, workflow_dispatch]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: article.tex
          compiler: xelatex

      - name: Show font info from log
        run: |
          echo "=== Missing characters ==="
          grep -i "missing character" article.log | head -20 || echo "none"
          echo ""
          echo "=== Fonts used ==="
          grep -i "fontspec\|Gyre\|Times" article.log | head -30 || echo "none"

      - name: Upload PDF and log
        uses: actions/upload-artifact@v4
        with:
          name: PDF-and-log
          path: |
            article.pdf
            article.log
