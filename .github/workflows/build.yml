name: Build LaTeX document
on: [push, workflow_dispatch]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: article.tex
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error"
          extra_system_packages: "font-liberation"

      # Добавляем шаг для дополнительной компиляции (на случай если latexmk пропустит)
      - name: Recompile for references
        run: |
          docker run --rm -v $PWD:/workdir -w /workdir ghcr.io/xu-cheng/texlive-full:latest xelatex -interaction=nonstopmode article.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: article.pdf
